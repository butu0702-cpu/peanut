services:
  - type: web
    name: yunlin-peanut-market
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: yunlin-peanut-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        value: file:/var/data/production.db
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_NOTIFY_TOKEN
        sync: false
